<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatalogoYa — Tu tienda virtual en minutos</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">🏬</span>
      <div>
        <h1>CatalogoYa</h1>
        <p class="brand-sub">Tu tienda virtual en minutos</p>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-emoji">🚀</div>
    <h2>Crea tu tienda virtual</h2>
    <p>Sube tus productos, comparte el link y recibe pedidos por WhatsApp</p>
    <a href="/crear-tienda" class="btn btn-light btn-lg">Crear mi tienda gratis</a>
  </section>

  <section class="benefits">
    <div class="benefit-card"><span>🛒</span><p>Carrito de compras</p></div>
    <div class="benefit-card"><span>💬</span><p>Pedidos por WhatsApp</p></div>
    <div class="benefit-card"><span>✅</span><p>100% gratis</p></div>
  </section>
</body>
</html>
